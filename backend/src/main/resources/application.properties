spring.application.name=recepti-backend

# PostgreSQL (vrednosti je mogoče prepisati z okoljskimi spremenljivkami)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recepti}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate sam ustvari / posodobi tabele iz entitet
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
